name: project2-microservices

services:
  order_service:
    build: ./OrderService
    ports:
      - "8000:8000"
    expose:
      - 8000
    volumes:
      - order_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  merchant_service:
    build: ./MerchantService
    ports:
      - "8001:8001"
    expose:
      - 8001
    volumes:
      - merchant_data:/app/data

  buyer_service:
    build: ./BuyerService
    ports:
      - "8002:8002"
    expose:
      - 8002
    volumes:
      - buyer_data:/app/data

  inventory_service:
    build: ./InventoryService
    ports:
      - "8003:8003"
    expose:
      - 8003
    volumes:
      - inventory_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  email_service:
    build: ./EmailService
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_SENDER_EMAIL=${RESEND_SENDER_EMAIL:-onboarding@resend.dev}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  payment_service:
    build: ./PaymentService
    volumes:
      - payment_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  order_data:
  merchant_data:
  buyer_data:
  inventory_data:
  payment_data:
  rabbitmq-data:
