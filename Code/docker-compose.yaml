name: project2-microservices

services:
  order_service:
    build: ./OrderService
    expose:
      - 8000
    volumes:
      - order_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  merchant_service:
    build: ./MerchantService
    expose:
      - 8001
    volumes:
      - merchant_data:/app/data

  buyer_service:
    build: ./BuyerService
    expose:
      - 8002
    volumes:
      - buyer_data:/app/data

  inventory_service:
    build: ./InventoryService
    expose:
      - 8003
    volumes:
      - inventory_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  email_service:
    build: ./EmailService
    depends_on:
      rabbitmq:
        condition: service_healthy

  payment_service:
    build: ./PaymentService
    volumes:
      - payment_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  order_data:
  merchant_data:
  buyer_data:
  inventory_data:
  payment_data:
  rabbitmq-data:
